name: it_asset_scanner
description: "Mobile Scanner App for Windows Agent IT Asset Inspection & Audit"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  mobile_scanner: ^5.2.3
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_commons: ^0.8.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
