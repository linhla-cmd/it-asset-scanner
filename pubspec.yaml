name: it_asset_scanner
description: "Mobile Scanner App for Windows Agent IT Asset Inspection & Audit"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP & API
  http: ^1.2.1
  
  # QR/Barcode Scanning
  mobile_scanner: ^5.2.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # UI & Formatting
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0
  
  # Permissions & Hardware
  permission_handler: ^11.3.1
  
  # Connectivity
  connectivity_plus: ^5.0.0
  
  # Biometric
  local_auth: ^2.1.2
  
  # File Export
  excel: ^4.0.0
  pdf: ^3.10.0
  printing: ^5.11.0
  file_picker: ^6.1.1
  
  # Audio & Haptics
  just_audio: ^0.9.36
  
  # State Management (optional)
  provider: ^6.1.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
